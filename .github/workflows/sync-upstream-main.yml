name: Sync upstream to main

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward clean main from Stream4Me
        run: |
          git fetch https://github.com/Stream4me/addon.git master
          git push origin FETCH_HEAD:refs/heads/main

